<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模架工装智能管理系统原型 v1.6</title>
  <style>
    :root{--primary:#1677ff;--nav:#10233f;--bg:#f3f6fb;--card:#fff;--line:#d8e1ee;--text:#1f2d3d;--muted:#6b7a90;--head:#f5f8fd;--ok:#0f9f6e;--warn:#d98500;--bad:#d4380d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{border:1px solid var(--line);background:#fff;border-radius:4px;padding:7px 12px;cursor:pointer}button:hover{border-color:var(--primary);color:var(--primary)}button.primary{background:var(--primary);border-color:var(--primary);color:#fff}.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}.side{background:var(--nav);color:#dce8ff;padding:14px 10px;overflow:auto}.brand{font-size:18px;font-weight:700;margin:6px 8px 18px}.group{margin:14px 8px 6px;color:#8ca8ce;font-size:12px}.nav-btn{display:block;width:100%;text-align:left;border:0;background:transparent;color:#dce8ff;border-radius:4px;padding:9px 10px}.nav-btn.active,.nav-btn:hover{background:#1d3b68;color:#fff}.main{min-width:0}.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.top h1{margin:0;font-size:18px}.content{padding:18px 22px 88px}.toolbar,.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi b{display:block;font-size:25px;margin-top:8px}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}.table th,.table td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px;text-align:left}.table th{background:var(--head);color:#52657d;font-weight:600}.tag{display:inline-block;padding:2px 8px;border-radius:12px;background:#eef5ff;color:#1762b7;font-size:12px}.tag.warn{background:#fff7e6;color:var(--warn)}.tag.bad{background:#fff1f0;color:var(--bad)}.split-map{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:16px}.map{height:690px;position:relative;background:#eaf3ff;border:1px solid var(--line);border-radius:6px;overflow:hidden}.china{position:absolute;left:7%;top:8%;right:7%;bottom:8%;background:linear-gradient(135deg,#d8ecff,#b8d9fb);clip-path:polygon(24% 6%,63% 3%,79% 19%,91% 35%,86% 62%,70% 77%,50% 91%,28% 82%,12% 60%,8% 36%);border:1px solid #8fbae8}.province{position:absolute;border:1px solid #9fc4ea;background:#ffffff55;border-radius:4px;color:#5a7898;font-size:12px;padding:3px 6px}.marker{position:absolute;transform:translate(-50%,-50%);padding:5px 9px;border-radius:14px;background:#fff;border:2px solid var(--primary);box-shadow:0 6px 16px #4562;white-space:nowrap}.marker.project{border-color:#ff8a00}.result{display:grid;grid-template-columns:1fr auto;gap:10px;border:1px solid var(--line);border-radius:6px;padding:12px;margin-top:10px;background:#fff;cursor:pointer}.score{font-size:22px;color:var(--ok);font-weight:700}.tree-row{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:8px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}.tree-head{background:var(--head);font-weight:600}.indent{display:inline-block;width:calc(var(--lv)*24px)}.config{position:fixed;right:20px;bottom:20px;width:380px;background:#fff;border:1px solid var(--line);box-shadow:0 12px 36px #1f3b5f2e;border-radius:8px;z-index:20}.config.min{width:auto}.config-head{height:42px;background:#f7fbff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px}.config-body{padding:12px;max-height:480px;overflow:auto}.config.min .config-body{display:none}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:4px;padding:8px;background:#fff}.drawer,.modal{position:fixed;inset:0;background:#10233f55;z-index:40;display:grid;place-items:center}.card{width:min(980px,94vw);max-height:86vh;background:#fff;border-radius:8px;box-shadow:0 18px 50px #0003;overflow:auto}.card.small{width:min(760px,92vw)}.card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}.card-body{padding:16px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.detail-item{border:1px solid var(--line);border-radius:4px;padding:10px}.detail-item span{display:block;color:var(--muted);font-size:12px}.approval{border:1px dashed #9fc4ff;background:#f7fbff;border-radius:6px;padding:12px;margin-top:12px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#10233f;color:#fff;padding:10px 16px;border-radius:6px;display:none;z-index:80}.toast.show{display:block}@media(max-width:1080px){.app{grid-template-columns:1fr}.side{display:none}.split-map,.kpis,.grid2{grid-template-columns:1fr}.config{left:12px;right:12px;width:auto}}
  </style>
</head>
<body><div id="app"></div><div id="toast" class="toast"></div>
<script>
const storeKey="mjgz.prototype.online.v1.6";
const seed={page:"dash",cfgMin:false,version:"v1.6",pages:{dash:{n:"工作台",t:"dash"},assetMap:{n:"资产地图",t:"map"},warehouse:{n:"仓库设置",t:"warehouse"},category:{n:"产品分类",t:"tree"},product:{n:"产品档案",t:"list"},bom:{n:"BOM清单",t:"bom"},amortize:{n:"摊销规则",t:"list"},leaseRule:{n:"租赁规则",t:"list"},stock:{n:"库存台账",t:"list"},inout:{n:"出入库管理",t:"list",approval:true},transfer:{n:"调拨管理",t:"list",approval:true},check:{n:"盘点管理",t:"list"},leaseOrder:{n:"租赁订单",t:"list",approval:true},returnOrder:{n:"退场归还",t:"list",approval:true},design:{n:"设计管理",t:"list"},asset:{n:"资产台账",t:"list"},inspect:{n:"点检保养",t:"list"},repair:{n:"维修管理",t:"list",approval:true},scrap:{n:"报废处置",t:"list",approval:true},settle:{n:"结算管理",t:"list",approval:true},report:{n:"统计分析",t:"report"},version:{n:"版本管理",t:"version"},prd:{n:"PRD生成",t:"prd"}},rows:[["MJ-2026-001","液压爬模","科创公司","在库","良好"],["MJ-2026-002","盘扣脚手架","西安料具站","租赁中","良好"],["GZ-2026-018","挂篮工装","武汉项目仓","待检修","预警"],["MB-2026-031","钢模板","重庆项目仓","待调拨","良好"]],warehouses:[{id:"W01",name:"科创料具站",city:"成都",type:"物料站",match:96,dist:"18km",mat:"液压爬模 42套；盘扣 12000m；钢模板 660张",x:39,y:58},{id:"W02",name:"西安周转仓",city:"西安",type:"物料站",match:82,dist:"426km",mat:"盘扣 8600m；贝雷片 210片；支架 80套",x:50,y:43},{id:"W03",name:"武汉项目仓",city:"武汉",type:"项目仓库",match:74,dist:"690km",mat:"挂篮 6套；钢模板 300张；连接件 1800件",x:61,y:60},{id:"P01",name:"收货地点：成渝项目",city:"重庆",type:"收货地点",match:0,dist:"0km",mat:"项目计划租赁点",x:45,y:64}],warehouseTree:[{n:"A库区-标准模架",t:"库区",q:"容量70%",s:"启用",c:[{n:"A-01-01",t:"库位",q:"液压爬模12套",s:"可用"},{n:"A-01-02",t:"库位",q:"盘扣3200m",s:"可用"}]},{n:"B库区-维修暂存",t:"库区",q:"容量46%",s:"启用",c:[{n:"B-02-01",t:"库位",q:"待维修8套",s:"预警"}]}],bomTree:[{n:"液压爬模标准BOM",t:"BOM",q:"1套",s:"启用",c:[{n:"架体系统",t:"一级组件",q:"1组",s:"启用",c:[{n:"导轨",t:"物资",q:"8根",s:"启用"},{n:"附墙支座",t:"物资",q:"16件",s:"启用"}]},{n:"液压系统",t:"一级组件",q:"1组",s:"启用",c:[{n:"油缸",t:"物资",q:"4支",s:"启用"}]}]}],catTree:[{n:"模架类",t:"一级分类",q:"18个产品",s:"启用",c:[{n:"爬模",t:"二级分类",q:"6个产品",s:"启用"},{n:"脚手架",t:"二级分类",q:"8个产品",s:"启用"}]},{n:"工装类",t:"一级分类",q:"12个产品",s:"启用",c:[{n:"挂篮",t:"二级分类",q:"4个产品",s:"启用"}]}]};
let s=JSON.parse(localStorage.getItem(storeKey)||"null")||seed, modal=null, detail=null;
function save(){localStorage.setItem(storeKey,JSON.stringify(s))}function msg(t){let e=document.getElementById("toast");e.textContent=t;e.className="toast show";setTimeout(()=>e.className="toast",1800)}
function b(t,a,c=""){return `<button class="${c}" onclick="${a}">${t}</button>`}function nav(){let gs=[["业务总览",["dash","assetMap"]],["基础设置",["warehouse","category","product","bom","amortize","leaseRule"]],["资产仓库",["stock","inout","transfer","check"]],["订单管理",["leaseOrder","returnOrder"]],["设计资产",["design","asset","inspect","repair","scrap"]],["结算分析",["settle","report"]],["原型工作流",["version","prd"]]];return `<aside class="side"><div class="brand">模架工装原型</div>${gs.map(g=>`<div class="group">${g[0]}</div>${g[1].map(id=>`<button class="nav-btn ${s.page==id?"active":""}" onclick="go('${id}')">${s.pages[id].n}</button>`).join("")}`).join("")}</aside>`}
function go(id){s.page=id;save();render()}function layout(body){let p=s.pages[s.page];document.getElementById("app").innerHTML=`<div class="app">${nav()}<main class="main"><div class="top"><h1>${p.n}</h1><div>${s.version} · 科创优先 · 集团可推广</div></div><div class="content">${body}</div></main></div>${config()}${popups()}`}
function render(){let p=s.pages[s.page];if(p.t=="dash")return layout(dash());if(p.t=="map")return layout(mapPage());if(p.t=="warehouse")return layout(listPage(["仓库编码","仓库名称","所属单位","仓库类型","状态"],"warehouse"));if(p.t=="bom")return layout(listPage(["BOM编码","BOM名称","适用产品","版本","状态"],"bom"));if(p.t=="tree")return layout(treePage("产品分类层级",s.catTree));if(p.t=="report")return layout(report());if(p.t=="version")return layout(version());if(p.t=="prd")return layout(prd());return layout(listPage(["编号","名称","所属单位","状态","质量状态"],"normal"))}
function dash(){return `<div class="kpis">${[["资产总量","1286"],["可租赁资产","842"],["待审批","17"],["预警事项","9"]].map(x=>`<div class="panel kpi"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")}</div><br><div class="panel"><b>原型说明</b><p>v1.6 恢复为多模块原型：菜单、列表、弹窗、详情、审批开关、资产地图、仓库库区库位、BOM多级结构和产品分类层级均可演示。</p></div>`}
function listPage(headers,kind){let rows=kind=="warehouse"?[["W01","科创料具站","科创公司","物料站","启用"],["W02","西安周转仓","西北公司","物料站","启用"],["W03","武汉项目仓","华中公司","项目仓库","启用"]]:kind=="bom"?[["BOM-001","液压爬模标准BOM","液压爬模","v1.0","启用"],["BOM-002","盘扣脚手架BOM","盘扣脚手架","v1.0","启用"]]:s.rows;let act=kind=="warehouse"?"openTree('warehouse')":kind=="bom"?"openTree('bom')":"openDetail()";return `<div class="toolbar">${b("新增","msg('已打开新增弹窗')","primary")}${b("批量导入","msg('已触发导入')")}${b("导出","msg('已导出当前列表')")}</div><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}<th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i==4?stateTag(c):c}</td>`).join("")}<td>${b(kind=="normal"?"查看":"查看结构",act)} ${b("编辑","msg('已进入编辑')")}</td></tr>`).join("")}</tbody></table>`}
function stateTag(v){let cls=v.includes("预警")?"bad":v.includes("待")?"warn":"";return `<span class="tag ${cls}">${v}</span>`}
function treePage(title,data){return `<div class="toolbar">${b("新增分类","msg('已打开新增分类')","primary")}${b("展开全部","msg('已展开全部')")}</div><div class="panel"><h3>${title}</h3>${tree(data)}</div>`}
function tree(data,l=0){return `<div>${l==0?`<div class="tree-row tree-head"><span>名称</span><span>类型</span><span>数量/容量</span><span>状态</span></div>`:""}${data.map(n=>`<div class="tree-row" style="--lv:${l}"><span><i class="indent"></i>${n.n}</span><span>${n.t}</span><span>${n.q}</span><span>${stateTag(n.s)}</span></div>${n.c?tree(n.c,l+1):""}`).join("")}</div>`}
function mapPage(){return `<div class="split-map"><div class="map"><div class="china"></div>${["四川","陕西","湖北","重庆","河南"].map((p,i)=>`<span class="province" style="left:${22+i*12}%;top:${35+(i%2)*18}%">${p}</span>`).join("")}${s.warehouses.map(w=>`<button class="marker ${w.type=="收货地点"?"project":""}" style="left:${w.x}%;top:${w.y}%" onclick="openWh('${w.id}')">${w.name}</button>`).join("")}</div><div class="panel"><h3>租赁物资匹配查询</h3>${["收货地址","BOM清单","产品清单","仓库类型","近期可闲置"].map((x,i)=>`<div class="field"><label>${x}</label><input value="${["成渝高速项目","液压爬模标准BOM","液压爬模","全部仓库","30天内"][i]}"></div>`).join("")}${b("查询匹配仓库","msg('已按条件刷新匹配结果')","primary")}${s.warehouses.filter(w=>w.match).map(w=>`<div class="result" onclick="openWh('${w.id}')"><div><b>${w.name}</b><div>${w.city} · ${w.type} · ${w.dist}</div><small>${w.mat}</small></div><div class="score">${w.match}%</div></div>`).join("")}</div></div>`}
function report(){return `<div class="kpis"><div class="panel kpi"><span>周转率</span><b>72%</b></div><div class="panel kpi"><span>库存满足率</span><b>89%</b></div><div class="panel kpi"><span>维修超期</span><b>6</b></div><div class="panel kpi"><span>租赁收入</span><b>328万</b></div></div><br><div class="panel">按公司、项目、产品、仓库、订单状态维度生成统计报表。</div>`}
function version(){return `<div class="panel"><h3>版本管理</h3><p>当前线上版本 v1.6，可保存页面结构、配置项、表头、弹窗和审批开关。</p>${b("保存版本快照","msg('已保存版本快照')","primary")} ${b("回滚到 v1.0","msg('已回滚模拟版本')")}</div>`}
function prd(){return `<div class="panel"><h3>PRD 生成</h3><p>后续上传 Word 模板后，可自动带入页面说明、字段、角色权限、业务规则、审批流程和版本记录。</p>${b("生成 PRD 草稿","msg('已生成 PRD 草稿')","primary")}</div>`}
function config(){if(["version","prd"].includes(s.page))return "";let p=s.pages[s.page];return `<div class="config ${s.cfgMin?"min":""}"><div class="config-head"><b>页面配置</b><div>${b(s.cfgMin?"展开":"最小化","s.cfgMin=!s.cfgMin;save();render()")}${b("保存","save();msg('配置已保存')","primary")}</div></div><div class="config-body"><div class="field"><label>页面名称</label><input value="${p.n}" oninput="s.pages[s.page].n=this.value;save();render()"></div><div class="field"><label>审批流程</label><select onchange="s.pages[s.page].approval=this.value=='true';save();render()"><option value="false">关闭</option><option value="true" ${p.approval?"selected":""}>开启</option></select></div><div class="field"><label>配置说明</label><textarea rows="5">支持页面、表单、弹窗、按钮、列表表头、详情字段、特殊列表输入项和审批流配置。</textarea></div></div></div>`}
function popups(){let html="";if(detail){let p=s.pages[s.page];html+=`<div class="drawer"><div class="card"><div class="card-head"><b>详情</b>${b("关闭","detail=null;render()")}</div><div class="card-body"><div class="grid2">${["基础字段","图片资料","业务列表","当前状态"].map(x=>`<div class="detail-item"><span>${x}</span><b>示例${x}</b></div>`).join("")}</div>${p.approval?`<div class="approval"><b>审批处理</b><div class="field"><label>审批意见</label><textarea rows="3"></textarea></div>${b("同意","msg('审批已同意')","primary")} ${b("驳回","msg('审批已驳回')")}</div>`:""}</div></div></div>`}if(modal){let isW=modal=="warehouse";html+=`<div class="modal"><div class="card"><div class="card-head"><b>${isW?"库区库位详情":"BOM多级结构"}</b>${b("关闭","modal=null;render()")}</div><div class="card-body">${tree(isW?s.warehouseTree:s.bomTree)}</div></div></div>`}return html}
function openDetail(){detail=true;render()}function openTree(t){modal=t;render()}function openWh(id){let w=s.warehouses.find(x=>x.id==id);detail=true;render();setTimeout(()=>document.querySelector(".card-body").insertAdjacentHTML("afterbegin",`<div class="approval"><b>${w.name} 匹配物资</b><p>${w.mat}</p><p>满足率：${w.match||"-"}；距离：${w.dist}</p></div>`),0)}
render();
</script></body></html>
