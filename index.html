<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>模架工装智能管理系统原型 v1.5</title>
<style>
:root{--blue:#1677ff;--bg:#f4f7fb;--line:#d9e2ef;--text:#1f2d3d;--muted:#6b7a90;--head:#f6f9ff;--ok:#0f9f6e;--warn:#d98500}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{border:1px solid var(--line);background:#fff;border-radius:4px;padding:7px 12px;cursor:pointer}button.primary{background:var(--blue);border-color:var(--blue);color:#fff}.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}.side{background:#10233f;color:#dce8ff;padding:16px 12px}.brand{font-size:18px;font-weight:700;margin:4px 8px 18px}.group{margin:14px 0 6px;padding:0 8px;color:#88a4ca;font-size:12px}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;color:#dce8ff;padding:9px 10px;border-radius:4px}.nav.active,.nav:hover{background:#1d3b68}.main{display:flex;flex-direction:column;min-width:0}.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.top h1{font-size:18px;margin:0}.content{padding:18px 24px 80px}.toolbar,.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi b{display:block;font-size:24px;margin-top:8px}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}.table th{background:var(--head);color:#52657d;text-align:left;font-weight:600}.table th,.table td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px}.tag{display:inline-block;padding:2px 8px;border-radius:12px;background:#edf5ff;color:#1762b7;font-size:12px}.split{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px}.map{position:relative;height:680px;background:#eaf3ff;border:1px solid var(--line);border-radius:6px;overflow:hidden}.china{position:absolute;left:7%;top:8%;right:7%;bottom:8%;background:linear-gradient(135deg,#d7ebff,#b9dafc);clip-path:polygon(24% 6%,63% 3%,79% 19%,91% 35%,86% 62%,70% 77%,50% 91%,28% 82%,12% 60%,8% 36%);border:1px solid #8fbae8}.mark{position:absolute;transform:translate(-50%,-50%);padding:5px 9px;border-radius:14px;background:#fff;border:2px solid var(--blue);box-shadow:0 6px 16px #4562;white-space:nowrap}.mark.project{border-color:#ff8a00}.result{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:6px;padding:12px;margin-top:10px;background:#fff}.score{font-size:22px;color:var(--ok);font-weight:700}.floating{position:fixed;right:20px;bottom:20px;width:360px;background:#fff;border:1px solid var(--line);box-shadow:0 12px 36px #1f3b5f2e;border-radius:8px;z-index:20}.float-head{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);background:#f7fbff}.float-body{padding:12px;max-height:460px;overflow:auto}.floating.min{width:auto}.floating.min .float-body{display:none}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:4px;padding:8px;background:#fff}.drawer,.modal{position:fixed;inset:0;background:#10233f55;z-index:40;display:grid;place-items:center}.drawer-card,.modal-card{background:#fff;border-radius:8px;box-shadow:0 18px 50px #0003;max-height:86vh;overflow:auto}.drawer-card{width:min(880px,92vw)}.modal-card{width:min(980px,94vw)}.card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}.card-body{padding:16px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.detail-item{border:1px solid var(--line);border-radius:4px;padding:10px}.detail-item span{display:block;color:var(--muted);font-size:12px}.tree-row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:10px}.tree-head{background:var(--head);font-weight:600}.indent{display:inline-block;width:calc(var(--lv)*22px)}.actions{display:flex;gap:8px;flex-wrap:wrap}.approval{border:1px dashed #9fc4ff;background:#f7fbff;border-radius:6px;padding:12px;margin-top:12px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#10233f;color:#fff;padding:10px 16px;border-radius:6px;display:none;z-index:80}.toast.show{display:block}@media(max-width:980px){.app{grid-template-columns:1fr}.side{display:none}.split,.kpis,.grid2{grid-template-columns:1fr}.floating{left:12px;right:12px;width:auto}}
</style>
</head>
<body><div id="app"></div><div id="toast" class="toast"></div>
<script>
const key='mjgz.prototype.github.v1.5';
const seed={page:'dash',cfgMin:false,version:'v1.5',pages:{dash:{name:'工作台',type:'dash'},assetMap:{name:'资产地图',type:'map'},warehouse:{name:'仓库设置',type:'warehouse'},bom:{name:'BOM清单',type:'bom'},category:{name:'产品分类',type:'category'},stock:{name:'库存台账',type:'list',approval:false},order:{name:'租赁订单',type:'list',approval:true},maintain:{name:'维修保养',type:'list',approval:true},settle:{name:'结算管理',type:'list',approval:true},version:{name:'版本管理',type:'version'},prd:{name:'PRD生成',type:'prd'}},rows:[['MJ-2026-001','液压爬模','科创建筑','在库','良好'],['MJ-2026-002','盘扣脚手架','西安料具站','租赁中','良好'],['GZ-2026-018','挂篮工装','武汉项目仓','待检修','预警']],wh:[{id:'W01',name:'科创料具站',city:'成都',type:'物料站',match:96,dist:'18km',mat:'液压爬模 42套；盘扣 12000m；钢模板 660张',x:39,y:58},{id:'W02',name:'西安周转仓',city:'西安',type:'物料站',match:82,dist:'426km',mat:'盘扣 8600m；贝雷片 210片；支架 80套',x:50,y:43},{id:'W03',name:'武汉项目仓',city:'武汉',type:'项目仓库',match:74,dist:'690km',mat:'挂篮 6套；钢模板 300张；连接件 1800件',x:61,y:60},{id:'P01',name:'收货地点：成渝项目',city:'重庆',type:'收货地点',match:0,dist:'0km',mat:'项目计划租赁点',x:45,y:64}],warehouseTree:[{n:'A库区-标准模架',t:'库区',q:'容量 70%',s:'启用',c:[{n:'A-01-01',t:'库位',q:'液压爬模 12套',s:'可用'},{n:'A-01-02',t:'库位',q:'盘扣 3200m',s:'可用'}]},{n:'B库区-维修暂存',t:'库区',q:'容量 46%',s:'启用',c:[{n:'B-02-01',t:'库位',q:'待维修 8套',s:'预警'}]}],bomTree:[{n:'液压爬模标准BOM',t:'BOM',q:'1套',s:'启用',c:[{n:'架体系统',t:'一级组件',q:'1组',s:'启用',c:[{n:'导轨',t:'物资',q:'8根',s:'启用'},{n:'附墙支座',t:'物资',q:'16件',s:'启用'}]},{n:'液压系统',t:'一级组件',q:'1组',s:'启用',c:[{n:'油缸',t:'物资',q:'4支',s:'启用'}]}]}],catTree:[{n:'模架类',t:'一级分类',q:'18个产品',s:'启用',c:[{n:'爬模',t:'二级分类',q:'6个产品',s:'启用'},{n:'脚手架',t:'二级分类',q:'8个产品',s:'启用'}]},{n:'工装类',t:'一级分类',q:'12个产品',s:'启用',c:[{n:'挂篮',t:'二级分类',q:'4个产品',s:'启用'}]}]};
let s=JSON.parse(localStorage.getItem(key)||'null')||seed, modal=null, detail=null;
function save(){localStorage.setItem(key,JSON.stringify(s))}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.className='toast show';setTimeout(()=>e.className='toast',1800)}
function nav(){let groups=[['业务总览',['dash','assetMap']],['基础设置',['warehouse','category','bom']],['业务管理',['stock','order','maintain','settle']],['原型工作流',['version','prd']]];return '<aside class="side"><div class="brand">模架工装原型</div>'+groups.map(g=>'<div class="group">'+g[0]+'</div>'+g[1].map(id=>'<button class="nav '+(s.page==id?'active':'')+'" onclick="go(\''+id+'\')">'+s.pages[id].name+'</button>').join('')).join('')+'</aside>'}
function go(id){s.page=id;save();render()}function btn(t,act,cls=''){return '<button class="'+cls+'" onclick="'+act+'">'+t+'</button>'}
function layout(body){let p=s.pages[s.page];document.getElementById('app').innerHTML='<div class="app">'+nav()+'<main class="main"><div class="top"><h1>'+p.name+'</h1><div>v1.5 · 科创优先</div></div><div class="content">'+body+'</div></main></div>'+config()+drawers()}
function render(){let p=s.pages[s.page];if(p.type=='dash')return layout(dash());if(p.type=='map')return layout(map());if(p.type=='warehouse')return layout(list('仓库编码,仓库名称,所属单位,仓库类型,状态'.split(','),'wh'));if(p.type=='bom')return layout(list('BOM编码,BOM名称,适用产品,版本,状态'.split(','),'bom'));if(p.type=='category')return layout(treePage('产品分类层级',s.catTree));if(p.type=='version')return layout(version());if(p.type=='prd')return layout(prd());return layout(list('编号,名称,所属单位,状态,质量状态'.split(','),'normal'))}
function dash(){return '<div class="kpis">'+[['资产总量','1286'],['可租赁资产','842'],['待审批','17'],['预警事项','9']].map(x=>'<div class="panel kpi"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'</div><br><div class="panel"><b>当前设计原则</b><p>1.0 先满足科创核心流程，兼顾集团推广；页面细节、弹窗、表头、按钮和审批开关均可配置。</p></div>'}
function list(headers,kind){let rows=kind=='wh'?[['W01','科创料具站','科创公司','物料站','启用'],['W02','西安周转仓','西北公司','物料站','启用'],['W03','武汉项目仓','华中公司','项目仓库','启用']]:kind=='bom'?[['BOM-001','液压爬模标准BOM','液压爬模','v1.0','启用'],['BOM-002','盘扣脚手架BOM','盘扣脚手架','v1.0','启用']]:s.rows;let action=kind=='wh'?'openTree("warehouse")':kind=='bom'?'openTree("bom")':'openDetail()';return '<div class="toolbar">'+btn('新增','toast("已打开新增弹窗")','primary')+btn('批量导入','toast("已触发导入")')+btn('导出','toast("已导出当前列表")')+'</div><table class="table"><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'<th>操作</th></tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'<td class="actions">'+btn(kind=='normal'?'查看':'查看结构',action)+btn('编辑','toast("已进入编辑")')+'</td></tr>').join('')+'</tbody></table>'}
function treePage(title,data){return '<div class="toolbar">'+btn('新增分类','toast("已打开新增分类")','primary')+btn('展开全部','toast("已展开")')+'</div><div class="panel"><h3>'+title+'</h3>'+tree(data)+'</div>'}
function tree(data,l=0){return '<div>'+(l==0?'<div class="tree-row tree-head"><span>名称</span><span>类型</span><span>绑定数量</span><span>状态</span></div>':'')+data.map(n=>'<div class="tree-row" style="--lv:'+l+'"><span><i class="indent"></i>'+n.n+'</span><span>'+n.t+'</span><span>'+n.q+'</span><span><span class="tag">'+n.s+'</span></span></div>'+(n.c?tree(n.c,l+1):'')).join('')+'</div>'}
function map(){return '<div class="split"><div class="map"><div class="china"></div>'+s.wh.map(w=>'<button class="mark '+(w.type=='收货地点'?'project':'')+'" style="left:'+w.x+'%;top:'+w.y+'%" onclick="openWh(\''+w.id+'\')">'+w.name+'</button>').join('')+'</div><div class="panel"><h3>租赁物资匹配查询</h3>'+['收货地址','BOM清单','产品清单','仓库类型','近期可闲置'].map((x,i)=>'<div class="field"><label>'+x+'</label><input value="'+(['成渝高速项目','液压爬模标准BOM','液压爬模','全部仓库','30天内'][i])+'"></div>').join('')+btn('查询匹配仓库','toast("已按条件刷新匹配结果")','primary')+s.wh.filter(w=>w.match).map(w=>'<div class="result" onclick="openWh(\''+w.id+'\')"><div><b>'+w.name+'</b><div>'+w.city+' · '+w.type+' · '+w.dist+'</div><small>'+w.mat+'</small></div><div class="score">'+w.match+'%</div></div>').join('')+'</div></div>'}
function version(){return '<div class="panel"><h3>版本管理</h3><p>当前版本 v1.5，支持保存页面结构、配置项、表头、弹窗和审批开关。</p>'+btn('保存为 v1.5 快照','toast("已保存版本快照")','primary')+' '+btn('回滚到 v1.0','toast("已回滚模拟版本")')+'</div>'}
function prd(){return '<div class="panel"><h3>PRD 生成</h3><p>后续上传 Word 模板后，可按模板自动生成 PRD 文档，并带入角色权限、业务规则、审批流程和页面说明。</p>'+btn('生成 PRD 草稿','toast("已生成 PRD 草稿")','primary')+'</div>'}
function config(){if(['version','prd'].includes(s.page))return '';let p=s.pages[s.page];return '<div class="floating '+(s.cfgMin?'min':'')+'"><div class="float-head"><b>页面配置</b><div>'+btn(s.cfgMin?'展开':'最小化','s.cfgMin=!s.cfgMin;save();render()')+btn('保存','save();toast("配置已保存")','primary')+'</div></div><div class="float-body"><div class="field"><label>页面名称</label><input value="'+p.name+'" oninput="s.pages[s.page].name=this.value;save();render()"></div><div class="field"><label>审批流程</label><select onchange="s.pages[s.page].approval=this.value==\'true\';save();render()"><option value="false">关闭</option><option value="true" '+(p.approval?'selected':'')+'>开启</option></select></div><div class="field"><label>配置说明</label><textarea rows="5">支持列表表头、按钮、详情字段、新增/删除弹窗、特殊列表输入项、审批流开关等页面级配置。</textarea></div></div></div>'}
function drawers(){let html='';if(detail){let p=s.pages[s.page];html+='<div class="drawer"><div class="drawer-card"><div class="card-head"><b>详情</b>'+btn('关闭','detail=null;render()')+'</div><div class="card-body"><div class="grid2">'+['基础信息','资产图片','业务列表','当前状态'].map(x=>'<div class="detail-item"><span>'+x+'</span><b>示例'+x+'</b></div>').join('')+'</div>'+(p.approval?'<div class="approval"><b>审批处理</b><div class="field"><label>审批意见</label><textarea rows="3"></textarea></div>'+btn('同意','toast("审批已同意")','primary')+btn('驳回','toast("审批已驳回")')+'</div>':'')+'</div></div></div>'}if(modal){let isW=modal=='warehouse';html+='<div class="modal"><div class="modal-card"><div class="card-head"><b>'+(isW?'库区库位详情':'BOM多级结构')+'</b>'+btn('关闭','modal=null;render()')+'</div><div class="card-body">'+tree(isW?s.warehouseTree:s.bomTree)+'</div></div></div>'}return html}
function openDetail(){detail=true;render()}function openTree(t){modal=t;render()}function openWh(id){let w=s.wh.find(x=>x.id==id);detail=true;render();setTimeout(()=>{document.querySelector('.card-head b').textContent=w.name+' 仓库详情';document.querySelector('.card-body').insertAdjacentHTML('afterbegin','<div class="approval"><b>匹配物资</b><p>'+w.mat+'</p><p>满足率：'+w.match+'%；距离：'+w.dist+'</p></div>')},0)}
render();
</script></body></html>
